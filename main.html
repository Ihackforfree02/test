<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MR GAMES – Retro Edition</title>

  <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">

  <style>
    :root {
      --retro1: #ff007f;
      --retro2: #ff4b2b;
      --retro3: #ffbf00;
      --retro4: #00eaff;
      --retro-dark: #0a0014;
    }

    body {
      margin: 0;
      font-family: 'VCR OSD Mono', sans-serif;
      color: white;
      overflow: hidden;
      background: black;
    }

    /* BACKGROUND: RETRO OUTRUN STYLE */
    .retro-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    /* Neon moving gradient sky */
    .retro-sky {
      position: absolute;
      top: 0;
      width: 100%;
      height: 60vh;
      background: linear-gradient(to bottom, #1b0034, #51005a, #ff007f);
      animation: skyPulse 8s ease-in-out infinite;
    }

    @keyframes skyPulse {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
      100% { filter: brightness(1); }
    }

    /* Retro sun */
    .sun {
      position: absolute;
      top: 8vh;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #ffbf00, #ff007f);
      border-radius: 50%;
      filter: blur(4px);
      box-shadow: 0 0 80px #ff007f;
      animation: sunGlow 3s ease-in-out infinite;
    }

    @keyframes sunGlow {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
      100% { transform: translateX(-50%) scale(1); }
    }

    /* Animated retro grid */
    .grid {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 50vh;
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(0,234,255,0.35) 1px, transparent 1px),
        linear-gradient(to top, rgba(0,234,255,0.35) 1px, transparent 1px);
      transform: perspective(400px) rotateX(75deg);
      animation: gridMove 2s linear infinite;
    }

    @keyframes gridMove {
      from { background-position-y: 0; }
      to { background-position-y: 40px; }
    }

    /* NAVBAR */
    .nav-container {
      position: fixed;
      width: 100%;
      height: 60px;
      top: 0;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      z-index: 99;
      border-bottom: 2px solid #ff007f;
    }

    .nav-title {
      flex-grow: 1;
      font-size: 1.8rem;
      color: var(--retro3);
      text-shadow: 0 0 12px var(--retro3);
      letter-spacing: 2px;
    }

    .hamburger {
      width: 30px;
      height: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .hamburger div {
      height: 4px;
      background: #ffbf00;
      border-radius: 4px;
      transition: 0.3s;
      box-shadow: 0 0 6px #ffbf00;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      right: -260px;
      top: 0;
      width: 260px;
      height: 100vh;
      background: rgba(10, 0, 20, 0.9);
      border-left: 2px solid #ff007f;
      backdrop-filter: blur(8px);
      padding: 80px 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      transition: 0.35s ease;
      z-index: 999;
    }

    .sidebar a {
      color: #00eaff;
      padding: 12px;
      text-decoration: none;
      font-size: 1.2rem;
      border: 1px solid #00eaff55;
      border-radius: 8px;
      text-align: center;
      transition: 0.25s;
      text-shadow: 0 0 6px #00eaff;
    }

    .sidebar a:hover {
      background: #00eaff;
      color: black;
      box-shadow: 0 0 25px #00eaff;
    }

    /* HERO */
    .hero {
      margin-top: 130px;
      text-align: center;
    }

    .hero h1 {
      font-size: 4rem;
      color: #ffbf00;
      text-shadow: 0 0 25px #ffbf00, 0 0 50px #ff007f;
      letter-spacing: 3px;
    }

    .hero p {
      margin-top: 10px;
      font-size: 1.3rem;
      text-shadow: 0 0 10px #00eaff;
      opacity: 0.9;
    }

    .hero button {
      margin-top: 30px;
      padding: 12px 30px;
      background: #ff007f;
      color: white;
      border: none;
      font-size: 1.3rem;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px #ff007f;
      transition: 0.25s;
    }

    .hero button:hover {
      background: #ff4b2b;
      box-shadow: 0 0 30px #ff4b2b;
      transform: scale(1.05);
    }

  </style>
</head>

<body>

  <!-- RETRO BACKGROUND -->
  <div class="retro-bg">
    <div class="retro-sky"></div>
    <div class="sun"></div>
    <div class="grid"></div>
  </div>

  <!-- NAVBAR -->
  <div class="nav-container">
    <div class="nav-title">MR GAMES</div>
    <div class="hamburger" onclick="toggleMenu()">
      <div></div><div></div><div></div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar" class="sidebar">
    <a href="Games.html">Play</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="about_us.html">About Us</a>
    <a href="record.html">Records</a>
    <a href="use_full_links.html">Useful Links</a>
    <a href="Clash.html">Clash Picker</a>
    <a href="https://ihackforfree02.github.io/games/">MR GAMES GBA</a>
    <a href="https://ihackforfree02.github.io/mrgames-/">MR GAMES+ BETA</a>
    <a href="https://ihackforfree02.github.io/hollownight-sigma/">Hollow Knight Map</a>
    <a href="https://sigmasigmatoiletedge.github.io/">Nettle Web</a>
  </div>

  <!-- HERO -->
  <div class="hero">
    <h1>MR GAMES</h1>
    <p>Retro Arcade • Neon Lights • 80s Vibes</p>
    <button onclick="toggleMenu()">OPEN MENU</button>
  </div>

  <script>
    let menuOpen = false;

    function toggleMenu() {
      const sidebar = document.getElementById("sidebar");
      sidebar.style.right = menuOpen ? "-260px" : "0px";
      menuOpen = !menuOpen;
    }
  </script>

</body>
</html>
