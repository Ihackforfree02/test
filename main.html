<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MR GAMES | Retro Neon Portal</title>
  <link rel="icon" href="favicon.ico" />

  <style>
    /* ========== ROOT COLORS ========== */
    :root {
      --neon-cyan: #00faff;
      --neon-pink: #ff2d95;
      --neon-purple: #7d00ff;
      --dark-bg: #0a0a0a;
    }

    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      color: white;
      background: var(--dark-bg);
      overflow-x: hidden;
    }

    /* ========== RETRO GRID BACKGROUND ========== */
    .retro-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -3;
      background: black;
    }

    /* Grid floor */
    .grid {
      position: absolute;
      bottom: -10%;
      width: 200%;
      height: 70%;
      background-image: 
        linear-gradient(var(--neon-cyan) 2px, transparent 2px),
        linear-gradient(90deg, var(--neon-cyan) 2px, transparent 2px);
      background-size: 60px 60px;
      transform: perspective(500px) rotateX(65deg);
      animation: gridMove 7s linear infinite;
      opacity: 0.4;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(65deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(65deg) translateY(60px); }
    }

    /* 80's SUN */
    .sun {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #ffbf00 0%, #ff0066 50%, transparent 70%);
      border-radius: 50%;
      animation: sunPulse 3s ease-in-out infinite;
      opacity: 0.85;
      z-index: -2;
    }

    @keyframes sunPulse {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.08); }
      100% { transform: translateX(-50%) scale(1); }
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.04),
        rgba(255,255,255,0.04) 2px,
        rgba(0,0,0,0.1) 4px
      );
      z-index: 50;
      mix-blend-mode: overlay;
    }

    /* ========== NAVBAR / HAMBURGER ========== */
    .nav-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 200;
      width: 45px;
      height: 35px;
      cursor: pointer;
    }

    .nav-toggle div {
      width: 100%;
      height: 6px;
      background: var(--neon-cyan);
      margin: 6px 0;
      border-radius: 10px;
      transition: 0.3s;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .nav-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      border-right: 2px solid var(--neon-cyan);
      box-shadow: 0 0 30px var(--neon-cyan);
      transition: 0.4s;
      padding-top: 80px;
      z-index: 150;
    }

    .nav-menu a {
      display: block;
      padding: 20px;
      font-size: 1.2rem;
      text-decoration: none;
      color: var(--neon-cyan);
      font-weight: bold;
      text-shadow: 0 0 10px var(--neon-cyan);
      transition: 0.3s;
    }

    .nav-menu a:hover {
      background: rgba(0,255,255,0.15);
      padding-left: 30px;
    }

    /* ========== MAIN TITLE ========== */
    h1 {
      text-align: center;
      font-size: 4rem;
      margin-top: 140px;
      color: var(--neon-pink);
      text-shadow:
        0 0 15px var(--neon-pink),
        0 0 40px var(--neon-purple),
        0 0 80px var(--neon-purple);
    }

    p.subtitle {
      text-align: center;
      margin-top: -20px;
      font-size: 1.5rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    /* ========== FEATURE CARDS ========== */
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 35px;
      margin-top: 50px;
    }

    .tile {
      background: rgba(255,255,255,0.05);
      border: 2px solid var(--neon-purple);
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      font-size: 1.3rem;
      box-shadow: 0 0 30px var(--neon-purple);
      transition: 0.35s;
    }

    .tile:hover {
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 0 50px var(--neon-cyan);
      border-color: var(--neon-cyan);
    }

    .tile a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 26px;
      border-radius: 30px;
      background: var(--neon-cyan);
      color: black;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 15px var(--neon-cyan);
      transition: 0.3s;
    }

    .tile a:hover {
      background: var(--neon-pink);
      box-shadow: 0 0 20px var(--neon-pink);
    }

  </style>
</head>
