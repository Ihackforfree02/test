<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MR GAMES – Retro Edition</title>

  <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">

  <style>
    :root {
      --retro1: #ff007f;
      --retro2: #ff4b2b;
      --retro3: #ffbf00;
      --retro4: #00eaff;
      --retro-dark: #0a0014;
    }

    body {
      margin: 0;
      font-family: 'VCR OSD Mono', sans-serif;
      color: white;
      overflow-x: hidden;
      background: black;
      transition: background 0.3s;
    }

    .content-wrap {
      transition: transform 0.4s ease;
      position: relative;
      z-index: 1;
    }

    body.menu-open .content-wrap {
      transform: translateX(260px);
    }

    /* BACKGROUND */
    .retro-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .retro-sky {
      position: absolute;
      top: 0;
      width: 100%;
      height: 60vh;
      background: linear-gradient(to bottom, #1b0034, #51005a, #ff007f);
      animation: skyPulse 8s ease-in-out infinite;
    }

    @keyframes skyPulse {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
      100% { filter: brightness(1); }
    }

    .sun {
      position: absolute;
      top: 8vh;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #ffbf00, #ff007f);
      border-radius: 50%;
      filter: blur(4px);
      box-shadow: 0 0 80px #ff007f;
      animation: sunGlow 3s ease-in-out infinite;
    }

    @keyframes sunGlow {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .grid {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 50vh;
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(0,234,255,0.35) 1px, transparent 1px),
        linear-gradient(to top, rgba(0,234,255,0.35) 1px, transparent 1px);
      transform: perspective(400px) rotateX(75deg);
      animation: gridMove 2s linear infinite;
    }

    @keyframes gridMove {
      from { background-position-y: 0; }
      to { background-position-y: 40px; }
    }

    /* NAVBAR */
    .nav-container {
      position: fixed;
      width: 100%;
      height: 60px;
      top: 0;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      z-index: 99;
      border-bottom: 2px solid #ff007f;
    }

    .nav-title {
      flex-grow: 1;
      font-size: 1.8rem;
      color: var(--retro3);
      text-shadow: 0 0 12px var(--retro3);
      letter-spacing: 2px;
    }

    /* HAMBURGER */
    .hamburger {
      width: 30px;
      height: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .hamburger div {
      height: 4px;
      background: #ffbf00;
      border-radius: 4px;
      transition: 0.3s;
      box-shadow: 0 0 6px #ffbf00;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      right: -260px;
      top: 0;
      width: 260px;
      height: 100vh;
      background: rgba(10, 0, 20, 0.9);
      border-left: 2px solid #ff007f;
      backdrop-filter: blur(8px);
      padding: 80px 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      transition: 0.35s ease;
      z-index: 999;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar a {
      color: #00eaff;
      padding: 12px;
      text-decoration: none;
      font-size: 1.2rem;
      border: 1px solid #00eaff55;
      border-radius: 8px;
      text-align: center;
      transition: 0.25s;
      text-shadow: 0 0 6px #00eaff;
    }
    .sidebar a:hover {
      background: #00eaff;
      color: black;
      box-shadow: 0 0 25px #00eaff;
    }

    /* HERO */
    .hero {
      margin-top: 160px;
      text-align: center;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .hero h1 {
      font-size: 4.8rem;
      color: #ffbf00;
      text-shadow: 0 0 25px #ffbf00, 0 0 50px #ff007f;
      letter-spacing: 3px;
      animation: titleFloat 4s infinite ease-in-out;
    }

    @keyframes titleFloat {
      0% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }

    .hero p {
      margin-top: 10px;
      font-size: 1.5rem;
      text-shadow: 0 0 12px #00eaff;
      opacity: 0.9;
    }

    .hero button {
      margin-top: 30px;
      padding: 14px 36px;
      background: #ff007f;
      color: white;
      border: none;
      font-size: 1.4rem;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 25px #ff007f;
      transition: 0.25s;
    }

    .hero button:hover {
      background: #ff4b2b;
      box-shadow: 0 0 35px #ff4b2b;
      transform: scale(1.08);
    }

    /* GAMES SECTION */
    .games-section {
      margin-top: 120px;
      padding: 80px 20px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      border-top: 2px solid #ff007f55;
    }

    .games-title {
      text-align: center;
      font-size: 3rem;
      color: var(--retro3);
      text-shadow: 0 0 20px var(--retro3);
      margin-bottom: 40px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      width: 90%;
      margin: auto;
    }

    .game-card {
      background: rgba(0,0,0,0.55);
      border: 2px solid #00eaff55;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 20px #00eaff55;
      transition: 0.3s;
    }

    .game-card:hover {
      transform: scale(1.06);
      box-shadow: 0 0 35px #00eaff;
      border-color: #00eaff;
    }

    .game-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .game-card a {
      text-decoration: none;
      color: #00eaff;
      font-size: 1.2rem;
      text-shadow: 0 0 6px #00eaff;
    }

  </style>
</head>

<body>

  <div class="retro-bg">
    <div class="retro-sky"></div>
    <div class="sun"></div>
    <div class="grid"></div>
  </div>

  <div class="nav-container">

    <div id="menuBtn" class="hamburger">
      <div></div><div></div><div></div>
    </div>
  </div>

  <div id="sidebar" class="sidebar">

    <a href="about_us.html">About Us</a>

    <a href="https://ihackforfree02.github.io/games/">MR GAMES GBA</a>

    <a href="https://ihackforfree02.github.io/hollownight-sigma/">Hollow Knight Map</a>
    <a href="https://sigmasigmatoiletedge.github.io/">Nettle Web</a>
  </div>

  <div class="content-wrap">

    <div class="hero">
      <h1>MR GAMES</h1>
      <p>Retro Arcade • Neon Lights • 80s Vibes</p>
      <button onclick="document.getElementById('sidebar').classList.toggle('open'); document.body.classList.toggle('menu-open');">OPEN MENU</button>
    </div>

    <!-- GAMES SECTION -->
    <section class="games-section">
      <h2 class="games-title">All Games</h2>

      <div class="games-grid">

        <div class="game-card">
          <img src="https://via.placeholder.com/250x150?text=Time+Shooter" alt="">
          <a href="https://schoolaccountforme.github.io/Time-Shooter-3-SWAT/">Time Shooter</a>
        </div>
        <div class="game-card">
          <img src="https://via.placeholder.com/250x150?text=1v1.LOL" alt="">
          <a href="https://ihackforfree02.github.io/1v1.lol/">1v1.LOL</a>
        </div>
        <div class="game-card">
          <img src="https://via.placeholder.com/250x150?text=2048" alt="">
          <a href="https://schoolaccountforme.github.io/2048/">2048</a>
        </div>
        <div class="game-card">
          <img src="https://via.placeholder.com/250x150?text=GunSpin" alt="">

        </div>
        <div class="game-card">
          <img src="https://via.placeholder.com/250x150?text=Polytrack" alt="">
          <a href="https://ihackforfree02.github.io/polytrack.3/">Polytrack</a>
        </div>
      </div>
    </section>

  </div>

  <script>
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      document.body.classList.toggle("menu-open");
    });
  </script>

</body>
</html>
