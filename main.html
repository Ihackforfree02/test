<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MR GAMES | Unblocked Online Games</title>
  <link rel="icon" href="favicon.ico" />

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      --neon: #00ffff;
    }

    /* --- GLOBAL --- */
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: white;
      overflow-x: hidden;
      transition: background 0.5s ease;
    }

    /* Smooth fade-in */
    * {
      transition: all 0.25s ease !important;
    }

    /* --- TOP UI ELEMENTS --- */
    .background-picker {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1000;
    }

    .background-picker select {
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--neon);
      color: black;
      font-weight: bold;
      border: none;
      box-shadow: 0 0 12px var(--neon);
    }

    .floating-btn {
      position: fixed;
      z-index: 1000;
      border-radius: 30px;
      padding: 12px 22px;
      font-weight: bold;
      backdrop-filter: blur(7px);
      box-shadow: 0 0 15px var(--neon);
      cursor: pointer;
      transform: translateY(0);
    }

    .floating-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px var(--neon);
    }

    .settings {
      top: 15px;
      right: 15px;
      background: var(--neon);
      color: black;
    }

    .partner {
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #00ffff, #0078D7);
      color: black;
    }

    #chat-toggle {
      bottom: 20px;
      left: 20px;
      background: #0078D7;
      color: white;
    }

    /* --- RAIN EFFECT --- */
    .rain-wrapper {
      pointer-events: none;
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .raindrop {
      position: absolute;
      top: -20px;
      width: 2px;
      background: linear-gradient(180deg, #00ffff, #0077aa);
      border-radius: 50%;
      opacity: 0.5;
      animation: fall linear infinite;
      filter: blur(0.5px);
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    /* --- MAIN CONTENT --- */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 3.5rem;
      color: var(--neon);
      text-shadow: 0 0 15px var(--neon);
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 1.25rem;
      color: #f0db4f;
      opacity: 0.85;
      margin-bottom: 45px;
    }

    /* --- GRID --- */
    .grid {
      display: grid;
      gap: 35px;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      padding-bottom: 60px;
    }

    /* --- TILES --- */
    .tile {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #00ffff33;
      border-radius: 18px;
      padding: 35px 20px;
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
      box-shadow: 0 0 20px #00ffff22;
      backdrop-filter: blur(4px);
      transform: translateY(0);
      cursor: pointer;
    }

    .tile:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 0 35px #00ffff88;
    }

    .tile a {
      display: block;
      margin-top: 14px;
      padding: 11px 22px;
      border-radius: 30px;
      text-decoration: none;
      background: var(--neon);
      color: black;
      font-weight: bold;
      transition: 0.3s;
    }

    .tile a:hover {
      background: #00cccc;
    }
  </style>
</head>

<body>

  <!-- Background Picker -->
  <div class="background-picker">
    <select onchange="changeBackground(this.value)">
      <option value="neon">Neon</option>
      <option value="galaxy">Galaxy</option>
      <option value="retro">Retro</option>
    </select>
  </div>

  <!-- Settings Button -->
  <a href="settings.html" class="floating-btn settings">⚙️ Settings</a>

  <!-- Rain -->
  <div class="rain-wrapper" id="rain-wrapper"></div>

  <!-- Main -->
  <div class="container">
    <h1>MR GAMES</h1>
    <p class="subtitle">Welcome to the ultimate arcade experience</p>

    <div class="grid">
      <div class="tile">Play <a href="Games.html">Go</a></div>
      <div class="tile">Leaderboard <a href="leaderboard.html">View</a></div>
      <div class="tile">About Us <a href="about_us.html">Learn</a></div>
      <div class="tile">Records <a href="record.html">Check</a></div>
      <div class="tile">Useful Links <a href="use_full_links.html">Browse</a></div>
      <div class="tile">Clash Picker <a href="Clash.html">Open</a></div>
      <div class="tile">MR GAMES GBA <a href="https://ihackforfree02.github.io/games/">Launch</a></div>
      <div class="tile">MR GAMES+ BETA <a href="https://ihackforfree02.github.io/mrgames-/">Try</a></div>
      <div class="tile">Hollow Knight Map <a href="https://ihackforfree02.github.io/hollownight-sigma/">Explore</a></div>
      <div class="tile">Nettle Web <a href="https://sigmasigmatoiletedge.github.io/">Visit</a></div>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat-toggle" class="floating-btn" onclick="toggleChat()">💬 Chat</div>

  <!-- Partner -->
  <a href="https://ezunblocktheopps.github.io/" class="floating-btn partner">🤝 Partnered with Sigmi</a>

  <script>
    function toggleChat() {
      if (window.chatWindow && !window.chatWindow.closed) {
        window.chatWindow.focus();
      } else {
        window.chatWindow = window.open(
          "https://communityhelp.linewize.org/",
          "ChatWindow",
          "width=400,height=600"
        );
        if (!window.chatWindow) {
          alert("Popup blocked! Please allow popups to use chat.");
        }
      }
    }

    function changeBackground(theme) {
      const root = document.documentElement;
      if (theme === "neon") {
        root.style.setProperty("--bg-gradient", "linear-gradient(135deg, #0f0f0f, #1a1a1a)");
      } else if (theme === "galaxy") {
        root.style.setProperty("--bg-gradient", "linear-gradient(to right, #1e3c72, #2a5298)");
      } else if (theme === "retro") {
        root.style.setProperty("--bg-gradient", "linear-gradient(to right, #ff416c, #ff4b2b)");
      }
    }

    /* Rain drops */
    const rainWrapper = document.getElementById("rain-wrapper");
    for (let i = 0; i < 110; i++) {
      const drop = document.createElement("div");
      drop.classList.add("raindrop");
      drop.style.left = Math.random() * 100 + "vw";
      drop.style.width = 1 + Math.random() * 2 + "px";
      drop.style.height = 10 + Math.random() * 15 + "px";
      drop.style.animationDuration = 2 + Math.random() * 3 + "s";
      drop.style.animationDelay = Math.random() * 5 + "s";
      rainWrapper.appendChild(drop);
    }
  </script>
</body>
</html>
