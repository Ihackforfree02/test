<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR GAMES – Retro Edition</title>
<link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
<style>
:root {
  --retro1: #ff007f;
  --retro2: #ff4b2b;
  --retro3: #ffbf00;
  --retro4: #00eaff;
  --retro-dark: #0a0014;
}

body {
  margin: 0;
  font-family: 'VCR OSD Mono', sans-serif;
  color: white;
  overflow-x: hidden;
  background: black;
  image-rendering: pixelated;
}

.content-wrap {
  position: relative;
  z-index: 1;
  transition: transform 0.4s ease;
}
body.menu-open .content-wrap { transform: translateX(260px); }

/* RETRO BACKGROUND */
.retro-bg { position: fixed; inset:0; z-index:-1; overflow:hidden; }
.retro-sky { position:absolute; top:0; width:100%; height:60vh; background: linear-gradient(to bottom,#1b0034,#51005a,#ff007f); animation: skyPulse 8s ease-in-out infinite; }
@keyframes skyPulse { 0%, 100% {filter:brightness(1);} 50% {filter:brightness(1.3);} }
.sun { position:absolute; top:8vh; left:50%; transform:translateX(-50%); width:300px; height:300px; background:radial-gradient(circle,#ffbf00,#ff007f); border-radius:50%; filter:blur(4px); box-shadow:0 0 80px #ff007f; animation:sunGlow 3s ease-in-out infinite; }
@keyframes sunGlow { 0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.05);} }

/* GRID */
.grid { position:absolute; bottom:0; width:100%; height:50vh; background-size:40px 40px; background-image:linear-gradient(to right, rgba(255,0,255,0.6) 1px, transparent 1px), linear-gradient(to top, rgba(0,255,255,0.6) 1px, transparent 1px); transform:perspective(400px) rotateX(75deg); animation:gridMove 2s linear infinite, gridColorShift 4s infinite alternate; }
@keyframes gridMove { from{background-position-y:0;} to{background-position-y:40px;} }
@keyframes gridColorShift { 0%{background-image:linear-gradient(to right, rgba(255,0,255,0.6) 1px, transparent 1px),linear-gradient(to top, rgba(0,255,255,0.6) 1px, transparent 1px);} 50%{background-image:linear-gradient(to right, rgba(255,255,0,0.6) 1px, transparent 1px),linear-gradient(to top, rgba(0,255,0,0.6) 1px, transparent 1px);} 100%{background-image:linear-gradient(to right, rgba(0,255,255,0.6) 1px, transparent 1px),linear-gradient(to top, rgba(255,0,255,0.6) 1px, transparent 1px);} }

/* NAVBAR */
.nav-container { position: fixed; width:100%; height:60px; top:0; display:flex; align-items:center; padding:0 20px; background:rgba(0,0,0,0.4); backdrop-filter:blur(6px); z-index:99; border-bottom:2px solid #ff007f; }
.nav-title { flex-grow:1; font-size:1.8rem; color:var(--retro3); text-shadow:0 0 12px var(--retro3); letter-spacing:2px; }

/* PIXELATED HAMBURGER */
.hamburger {
  width:32px;
  height:24px;
  display:flex;
  flex-direction: column;
  justify-content: space-between;
  cursor:pointer;
  z-index:100;
}
.hamburger div {
  height:4px;
  background:#ffbf00;
  border-radius:0;
  transition: all 0.3s ease;
  box-shadow:0 0 4px #ffbf00;
}

/* Hamburger animation to X */
.hamburger.active div:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger.active div:nth-child(2) { opacity:0; }
.hamburger.active div:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

/* SIDEBAR */
.sidebar {
  position: fixed;
  left:-260px; /* hidden by default */
  top:0;
  width:260px;
  height:100vh;
  background: rgba(10,0,20,0.95);
  border-right:2px solid #ff007f;
  backdrop-filter: blur(8px);
  padding:80px 20px;
  display:flex;
  flex-direction:column;
  gap:22px;
  transition:0.35s ease;
  z-index:999;
}
.sidebar.open { left:0; }
.sidebar a { 
  color:#00eaff; 
  padding:12px; 
  text-decoration:none; 
  font-size:1.2rem; 
  border:1px solid #00eaff55; 
  border-radius:8px; 
  text-align:center; 
  transition:0.25s; 
  text-shadow:0 0 6px #00eaff;
  animation: neonFlicker 2s infinite;
}
@keyframes neonFlicker {
  0%,19%,21%,23%,25%,54%,56%,100% { opacity:1; text-shadow: 0 0 6px #00eaff; }
  20%,22%,24%,55% { opacity:0.5; text-shadow:0 0 2px #00eaff; }
}

/* HERO */
.hero { margin-top:120px; text-align:center; animation:fadeIn 2s ease forwards; opacity:0; }
@keyframes fadeIn { to{opacity:1;} }
.hero h1 { font-size:4.8rem; color:#ffbf00; text-shadow:0 0 25px #ffbf00,0 0 50px #ff007f; letter-spacing:3px; animation:titleFloat 4s infinite ease-in-out; }
@keyframes titleFloat { 0%{transform:translateY(0);}50%{transform:translateY(-12px);}100%{transform:translateY(0);} }
.hero p { margin-top:10px; font-size:1.5rem; text-shadow:0 0 12px #00eaff; opacity:0.9; }

/* GAMES SECTION */
.games-section { margin-top:80px; padding:80px 20px; background:rgba(0,0,0,0.65); backdrop-filter:blur(6px); border-top:2px solid #ff007f55; }
.games-title { text-align:center; font-size:3rem; color:var(--retro3); text-shadow:0 0 20px var(--retro3); margin-bottom:40px; }
.games-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:30px; width:90%; margin:auto; }
.game-card { background:rgba(0,0,0,0.55); border:2px solid #00eaff55; border-radius:12px; padding:15px; text-align:center; box-shadow:0 0 20px #00eaff55; transition:0.3s; }
.game-card:hover { transform:scale(1.06); box-shadow:0 0 35px #00eaff; border-color:#00eaff; }
.game-card img { width:100%; height:140px; object-fit:cover; border-radius:10px; margin-bottom:12px; }
.game-card a { text-decoration:none; color:#00eaff; font-size:1.2rem; text-shadow:0 0 6px #00eaff; }

/* COPYRIGHT */
.footer { text-align:center; padding:40px 0; font-family:'VCR OSD Mono',sans-serif; color:#ffbf00; text-shadow:0 0 12px #ffbf00; }

</style>
</head>
<body>

<div class="retro-bg">
  <div class="retro-sky"></div>
  <div class="sun"></div>
  <div class="grid"></div>
</div>

<div class="nav-container">
  <div class="hamburger" id="menuBtn"><div></div><div></div><div></div></div>
  <div class="nav-title">MR GAMES</div>
</div>

<div id="sidebar" class="sidebar">
  <a href="#">Play Games</a>
  <a href="leaderboard.html">Leaderboard</a>
  <a href="about_us.html">About Us</a>
  <a href="record.html">Records</a>
  <a href="use_full_links.html">Useful Links</a>
  <a href="Clash.html">Clash Picker</a>
  <a href="https://ihackforfree02.github.io/games/">MR GAMES GBA</a>
  <a href="https://ihackforfree02.github.io/mrgames-/">MR GAMES+ BETA</a>
  <a href="https://ihackforfree02.github.io/hollownight-sigma/">Hollow Knight Map</a>
  <a href="https://sigmasigmatoiletedge.github.io/">Nettle Web</a>
</div>

<div class="content-wrap">
  <div class="hero">
    <h1>MR GAMES</h1>
    <p>Retro Arcade • Neon Lights • 80s Vibes</p>
  </div>

  <section class="games-section">
    <h2 class="games-title">All Games</h2>
    <div class="games-grid" id="gamesGrid"></div>
  </section>

  <div class="footer">&copy; MR GAMES 2025</div>
</div>

<script>
const games = [
  ["Minecraft","https://ihackforfree02.github.io/Precision-Client-For-EaglerCraft/"],
  ["Time Shooter","https://schoolaccountforme.github.io/Time-Shooter-3-SWAT/"],
  ["1v1.LOL","https://ihackforfree02.github.io/1v1.lol/"],
  ["2048","https://schoolaccountforme.github.io/2048/"],
  ["Gun Spin","https://ihackforfree02.github.io/GunSpin/"]
  // Add more as needed
];

const grid = document.getElementById("gamesGrid");
games.forEach(g => {
  const div = document.createElement("div");
  div.className = "game-card";
  div.innerHTML = `<img src="https://via.placeholder.com/250x150?text=${encodeURIComponent(g[0])}" alt="${g[0]}"><a href="${g[1]}" target="_blank">${g[0]}</a>`;
  grid.appendChild(div);
});

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("open");
  document.body.classList.toggle("menu-open");
  menuBtn.classList.toggle("active"); // animate burger
});
</script>
</body>
</html>
