<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR GAMES – Retro Edition</title>
<link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
<style>
:root {
--retro1: #ff007f;
--retro2: #ff4b2b;
--retro3: #ffbf00;
--retro4: #00eaff;
--retro-dark: #0a0014;
}

/* BODY & BASIC */
body {
margin:0;
font-family:'VCR OSD Mono',sans-serif;
color:white;
background:black;
overflow-x:hidden;
image-rendering: pixelated;
scroll-behavior: smooth;
position:relative;
}

/* RETRO BACKGROUND */
.retro-bg {position:fixed; inset:0; z-index:-1; overflow:hidden;}
.retro-sky {position:absolute; top:0; width:100%; height:60vh; background: linear-gradient(to bottom,#1b0034,#51005a,#ff007f); animation:skyPulse 10s ease-in-out infinite;}
@keyframes skyPulse {0%,100%{filter:brightness(1);}50%{filter:brightness(1.3);}}
.sun {position:absolute; top:8vh; left:50%; transform:translateX(-50%); width:300px; height:300px; background:radial-gradient(circle,#ffbf00,#ff007f); border-radius:50%; filter:blur(4px); box-shadow:0 0 80px #ff007f; animation:sunGlow 3s ease-in-out infinite;}
@keyframes sunGlow {0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.05);}}
.grid {position:absolute; bottom:0; width:100%; height:50vh; background-size:40px 40px; background-image:linear-gradient(to right, rgba(255,0,255,0.6) 1px, transparent 1px), linear-gradient(to top, rgba(0,255,255,0.6) 1px, transparent 1px); transform:perspective(400px) rotateX(75deg); animation:gridMove 2s linear infinite, gridColorShift 5s infinite alternate;}
@keyframes gridMove {from{background-position-y:0;} to{background-position-y:40px;}}
@keyframes gridColorShift {0%{background-image:linear-gradient(to right, rgba(255,0,255,0.6) 1px, transparent 1px),linear-gradient(to top, rgba(0,255,255,0.6) 1px, transparent 1px);}50%{background-image:linear-gradient(to right, rgba(255,255,0,0.6) 1px, transparent 1px),linear-gradient(to top, rgba(0,255,0,0.6) 1px, transparent 1px);}100%{background-image:linear-gradient(to right, rgba(0,255,255,0.6) 1px, transparent 1px),linear-gradient(to top, rgba(255,0,255,0.6) 1px, transparent 1px);}}

/* SCANLINES */
body::after {
content:"";
position:fixed;
inset:0;
pointer-events:none;
background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 2px);
z-index:5;
}

/* NAVBAR */
.nav-container {position:fixed; top:0; width:100%; height:60px; display:flex; align-items:center; padding:0 20px; background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); z-index:99; border-bottom:2px solid #ff007f;}
.nav-title {font-size:1.8rem; color:var(--retro3); text-shadow:0 0 12px var(--retro3); letter-spacing:2px;}

/* HERO */
.hero {margin-top:80px; text-align:center; animation:fadeIn 2s ease forwards; opacity:0;}
@keyframes fadeIn {to{opacity:1;}}
.hero h1 {font-size:4.8rem; color:#ffbf00; text-shadow:0 0 25px #ffbf00,0 0 50px #ff007f; letter-spacing:3px; animation:titleFloat 4s infinite ease-in-out;}
@keyframes titleFloat {0%{transform:translateY(0);}50%{transform:translateY(-12px);}100%{transform:translateY(0);}}
.hero p {margin-top:10px; font-size:1.5rem; text-shadow:0 0 12px #00eaff; opacity:0.9;}

/* INTRO SECTION */
.intro {padding:60px 20px; text-align:center; color:#00eaff; text-shadow:0 0 12px #00eaff;}
.intro h2 {font-size:3rem; margin-bottom:20px;}
.intro p {font-size:1.3rem; line-height:1.6; max-width:800px; margin:auto;}

/* FEATURED GAMES */
.featured {padding:60px 20px; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px);}
.featured h2 {text-align:center; font-size:2.8rem; color:#ffbf00; text-shadow:0 0 20px #ffbf00; margin-bottom:40px;}
.featured-grid {display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:30px; width:90%; margin:auto;}
.feature-card {background:rgba(0,0,0,0.55); border:2px solid #ff007f55; border-radius:12px; padding:15px; text-align:center; box-shadow:0 0 20px #ff007f55; transition:0.3s;}
.feature-card:hover {transform:scale(1.06); box-shadow:0 0 35px #ff007f; border-color:#ff007f;}
.feature-card img {width:100%; height:140px; object-fit:cover; border-radius:10px; margin-bottom:12px; image-rendering:pixelated;}
.feature-card a {text-decoration:none; color:#ff007f; font-size:1.2rem; text-shadow:0 0 6px #ff007f;}

/* ALL GAMES */
.games-section {margin-top:40px; padding:80px 20px; background:rgba(0,0,0,0.65); backdrop-filter:blur(6px); border-top:2px solid #ff007f55;}
.games-title {text-align:center; font-size:3rem; color:var(--retro3); text-shadow:0 0 20px var(--retro3); margin-bottom:40px;}
.games-grid {display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:30px; width:90%; margin:auto;}
.game-card {background:rgba(0,0,0,0.55); border:2px solid #00eaff55; border-radius:12px; padding:15px; text-align:center; box-shadow:0 0 20px #00eaff55; transition:0.3s;}
.game-card:hover {transform:scale(1.06); box-shadow:0 0 35px #00eaff; border-color:#00eaff;}
.game-card img {width:100%; height:140px; object-fit:cover; border-radius:10px; margin-bottom:12px; image-rendering:pixelated;}
.game-card a {text-decoration:none; color:#00eaff; font-size:1.2rem; text-shadow:0 0 6px #00eaff;}

/* SECONDARY LINKS UNDER GAMES */
.secondary-links {margin-top:60px; text-align:center; display:flex; flex-wrap:wrap; justify-content:center; gap:20px;}
.secondary-links a {color:#ffbf00; text-decoration:none; font-size:1.2rem; padding:8px 16px; border:1px solid #ffbf0055; border-radius:8px; text-shadow:0 0 8px #ffbf00; transition:0.25s;}
.secondary-links a:hover {background:#ffbf00; color:black; box-shadow:0 0 20px #ffbf00; transform:scale(1.05);}

/* BOTTOM LINKS */
.bottom-links {margin-top:40px; padding:20px 0; text-align:center; display:flex; flex-wrap:wrap; justify-content:center; gap:18px;}
.bottom-links a {color:#00eaff; text-decoration:none; font-size:1.2rem; padding:8px 14px; border:1px solid #00eaff55; border-radius:6px; text-shadow:0 0 6px #00eaff; transition:0.25s;}
.bottom-links a:hover {background:#00eaff; color:black; box-shadow:0 0 20px #00eaff; transform:scale(1.05);}

/* TIPS / TRIVIA */
.tips {padding:60px 20px; text-align:center; color:#ff007f; text-shadow:0 0 12px #ff007f;}
.tips h2 {font-size:2.8rem; margin-bottom:20px;}
